<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>نظام الأقساط</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="config.js"></script>
<style>
/* Layout idea: one-column phone tool for a shop counter. Customer list with status first, customer file with a payment box and a QR card. */
:root{
  --ink:#16202e;
  --muted:#5b6678;
  --paper:#eef1f6;
  --card:#ffffff;
  --line:#d8dee9;
  --wash:#e2e8f3;
  --accent:#0b63ce;
  --accent-ink:#ffffff;
  --signal:#e2a21a;
  --warn-ink:#8a5b00;
  --bad:#b4372b;
  --good:#1f7a45;
  --f:"Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e7edf8;--muted:#9fabc2;--paper:#0e1522;--card:#161f31;--line:#27334b;--wash:#1e2940;
    --accent:#6ea8ff;--accent-ink:#071327;--signal:#f2b84a;--warn-ink:#f2b84a;--bad:#ff8a7a;--good:#5fd08a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#e7edf8;--muted:#9fabc2;--paper:#0e1522;--card:#161f31;--line:#27334b;--wash:#1e2940;
  --accent:#6ea8ff;--accent-ink:#071327;--signal:#f2b84a;--warn-ink:#f2b84a;--bad:#ff8a7a;--good:#5fd08a;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.55;font-variant-numeric:tabular-nums}
.app{max-width:620px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:1.5rem;font-weight:800;margin:0;text-wrap:balance}
h2{font-size:1.1rem;font-weight:800;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 12px;font-size:.92rem}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-height:44px}
.top h1{flex:1;min-width:0}
.back{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer}
.note{margin:0 0 12px;padding:8px 12px;border-radius:10px;background:var(--wash);font-size:.9rem}
.loading{color:var(--muted);margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
textarea,input,select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:70px}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.btn{font:inherit;font-weight:700;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 14px;cursor:pointer;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.small{padding:7px 12px;font-size:.9rem}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{display:flex;width:100%;margin-bottom:14px}
.btn[disabled]{opacity:.55;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions .btn{flex:1 1 auto}
.chip{display:inline-block;font:inherit;font-size:.78rem;border-radius:999px;padding:2px 10px;border:1px solid var(--line);color:var(--muted);background:transparent;white-space:nowrap}
.chip.new{color:var(--warn-ink);border-color:var(--signal)}
.chip.ok{color:var(--good);border-color:var(--good)}
.chip.bad{color:var(--bad);border-color:var(--bad);font-weight:700}
.chip.now{color:var(--accent);border-color:var(--accent);font-weight:700}
.empty{color:var(--muted);text-align:center;padding:14px 8px;margin:0 0 12px}
.err{color:var(--bad);margin:0 0 10px;font-size:.92rem}

/* list */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.tile span{display:block;color:var(--muted);font-size:.8rem}
.tile b{font-size:1.25rem}
.tile.late b{color:var(--bad)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}
.filters button{font:inherit;font-weight:700;font-size:.9rem;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:6px 14px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.c-card{display:block;width:100%;text-align:start;font:inherit;color:inherit;cursor:pointer;border-inline-start:5px solid var(--line)}
.c-card.late{border-inline-start-color:var(--bad)}
.c-card.soon{border-inline-start-color:var(--signal)}
.c-card.ok{border-inline-start-color:var(--good)}
.c-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.c-top b{font-size:1.1rem}
.c-sub{color:var(--muted);font-size:.9rem;margin:2px 0 8px}
.c-foot{display:flex;justify-content:space-between;gap:8px;font-size:.92rem;margin-top:8px;flex-wrap:wrap}
.bar{height:8px;border-radius:999px;background:var(--wash);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:999px}

/* detail */
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:12px 0}
.kv div span{display:block;color:var(--muted);font-size:.82rem}
.kv div b{font-size:1.05rem}
.kv .wide{grid-column:1 / -1}
.late-box{border:1px solid var(--bad);border-radius:12px;padding:10px 12px;margin:12px 0;color:var(--bad);font-weight:700}
.pay-form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.pay-form .wide{grid-column:1 / -1}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label,.lbl{font-weight:700;font-size:.92rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pay-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.pay-list li{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pay-list li:last-child{border-bottom:0}
.pay-list .pi{flex:1;min-width:120px;display:flex;flex-direction:column}
.pay-list small{color:var(--muted)}
.x{font:inherit;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--bad);cursor:pointer;font-size:1.2rem;line-height:1}
.just{background:var(--wash);border-radius:10px;padding:10px 12px;margin-bottom:10px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.qrbox{background:#fff;border-radius:12px;padding:8px;max-width:260px;margin:8px auto 12px;border:1px solid var(--line)}
.qrbox svg{display:block;width:100%;height:auto}
.qrname{text-align:center;font-weight:800;font-size:1.1rem}
.qrcode{text-align:center;color:var(--muted);font-size:.9rem;margin-bottom:10px}
.settings input{margin-top:6px}

.toast{position:fixed;bottom:20px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:5;text-align:center}
.toast.show{opacity:1;transform:none}
@media (max-width:420px){ .two,.pay-form{grid-template-columns:1fr} .tiles{grid-template-columns:1fr 1fr 1fr} .tile b{font-size:1.05rem} }
@media (prefers-reduced-motion:reduce){ .toast{transition:none} }
.sched{list-style:none;margin:0;padding:0}
.sched li{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.93rem}
.sched li:last-child{border-bottom:0}
.sched .no{width:26px;color:var(--muted)}
.sched .dt{flex:1}
.sched .st{font-weight:700}
.sched .st.p{color:var(--good)}.sched .st.h{color:var(--warn-ink)}.sched .st.l{color:var(--bad)}.sched .st.f{color:var(--muted);font-weight:500}
details>summary{cursor:pointer;font-weight:800;font-size:1.05rem;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"﹀";float:inline-end;color:var(--muted)}
details[open]>summary::after{content:"︿"}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs a{flex:1;text-align:center;text-decoration:none;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:10px;padding:8px}
.tabs a[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rep-row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.rep-row:last-child{border-bottom:0}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button id="back" class="back" type="button" hidden>رجوع</button>
    <h1 id="title">أقساط العملاء</h1>
    <button id="who" class="back" type="button" hidden></button>
  </header>
  <p id="note" class="note" role="status" hidden></p>
  <main id="main"></main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* The page link that each contract's QR code opens: wherever this page is hosted. */
var BASE = (function(){ try { return location.origin + location.pathname; } catch(e){ return ''; } })();
var OWNER = String((window.APP_CONFIG && window.APP_CONFIG.ownerEmail) || '').trim().toLowerCase();

/* ---------- helpers ---------- */
var $ = function(id){ return document.getElementById(id); };
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function round2(x){ return Math.round(x * 100) / 100; }
function fmt(n){ return round2(n || 0).toLocaleString('en-US', {maximumFractionDigits: 2}); }
function uid(){ return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function newToken(){
  var a = [], i;
  try { var u = new Uint8Array(16); crypto.getRandomValues(u); for (i = 0; i < u.length; i++) a.push(('0' + u[i].toString(16)).slice(-2)); }
  catch(e){ for (i = 0; i < 16; i++) a.push(('0' + Math.floor(Math.random() * 256).toString(16)).slice(-2)); }
  return a.join('');
}
var toastTimer = null;
function toast(msg){
  var el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2600);
}
var MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
function pad(n){ return n < 10 ? '0' + n : '' + n; }
function iso(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function pd(s){ var p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function today0(){ var d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function edate(d, k){
  var t = new Date(d.getFullYear(), d.getMonth() + k, 1);
  var last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
  t.setDate(Math.min(d.getDate(), last));
  return t;
}
function fmtDate(d){ return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }
function fmtISO(s){ return s ? fmtDate(pd(s)) : ''; }
function monthsFull(a, b){
  var m = (b.getFullYear() - a.getFullYear()) * 12 + b.getMonth() - a.getMonth();
  if (b.getDate() < a.getDate()) m--;
  return m;
}

/* ---------- state ---------- */
var S = { contracts: [], pays: [], view: 'list', curId: null, filter: 'work', cat: 'all', q: '', draft: null, confirm: null,
          mode: 'pending', note: '', limit: 60, imp: null, justPaid: null, day: iso(today0()),
          set: { shop: 'محل الموبايلات', minLate: 50 }, staff: [], user: null, auth: 'wait', busy: false };
function isOwner(){ return !!(S.user && S.user.role === 'owner'); }
var FB = null, unsubs = [], writeTimers = {}, portalTimers = {}, needRender = false, setTimer = null;
var dl = { save: function(o){
  return new Promise(function(res){
    var a = document.createElement('a'); a.href = URL.createObjectURL(o.data); a.download = o.filename;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000); res();
  });
} };

/* ---------- installment math (mirrors the Excel workbook) ---------- */
function amountsOf(c){
  var a = [], i, L;
  if (c.plan && c.plan.length){ c.plan.forEach(function(s){ for (i = 0; i < s.m; i++) a.push(+s.a); }); }
  else {
    L = c.months > 0 ? Math.ceil((+c.total || 0) / c.months - 1e-9) : 0; if (!(L > 0)) L = 0;
    for (i = 0; i < (c.months || 0); i++) a.push(L);
  }
  return a;
}
function cumOf(a, total){
  var cum = [0], s = 0; a.forEach(function(x){ s += x; cum.push(Math.min(total, s)); });
  return cum;
}
function planText(c){
  if (c.plan && c.plan.length) return c.plan.map(function(s){ return s.m + '×' + fmt(s.a); }).join(' + ');
  var L = c.months > 0 ? Math.ceil((+c.total || 0) / c.months - 1e-9) : 0;
  return c.months + '×' + fmt(L);
}
function calc(c){
  var set = S.set, minLate = +set.minLate || 0;
  var A = amountsOf(c), K = A.length, cum = cumOf(A, +c.total || 0);
  var today = today0();
  var bg = c.first ? pd(c.first) : (c.sold ? edate(pd(c.sold), 1) : null);
  var pays = payList(c), ext = c.ext || [], perms = c.perms || [];
  var Y = 0, Z = 0, settled = false;
  pays.forEach(function(p){ Y += +p.amount || 0; Z += +p.extra || 0; if (p.type === 'تسوية') settled = true; });
  var AA = 0; ext.forEach(function(x){ AA += +x.amount || 0; });
  var X = 0;
  if (bg && bg < today) X = Math.min(K, monthsFull(bg, new Date(today.getFullYear(), today.getMonth(), today.getDate() - 1)) + 1);
  if (X < 0) X = 0;
  var AO = (X > 0 && perms.some(function(p){ return p.inst === X; })) ? 1 : 0;
  var BI = Math.max(0, X - AO);
  var AB = Math.min(AA, Z + Math.max(0, Y - Z - cum[Math.min(BI, K)]));
  var AC = Y - AB;
  var total = +c.total || 0;
  var rem = settled ? 0 : Math.max(0, total - AC) + AA - AB;
  var late = settled ? 0 : Math.min(Math.max(0, total - AC), Math.max(0, cum[Math.min(BI, K)] - AC)) + (BI >= K ? AA - AB : 0);
  var cov = 0; while (cov < K && cum[cov + 1] <= AC + 1e-9 && A[cov] > 0) cov++;
  var cur = K ? A[Math.min(cov, K - 1)] : 0;
  var next = (settled || rem <= 0 || cov + 1 > K || !bg) ? null : edate(bg, cov);
  var days = 0;
  if (late > minLate && bg) days = Math.max(0, Math.round((today - edate(bg, Math.min(K, cov + 1) - 1)) / 86400000));
  var status;
  if (!c.sold || isNaN(pd(c.sold))) status = 'تاريخ البيع غلط';
  else if (pd(c.sold) > today) status = 'تاريخ البيع في المستقبل';
  else if (settled) status = 'اتقفل بتسوية';
  else if (rem <= 0) status = 'خلصان';
  else if (late <= minLate) status = AO ? 'مستأذن' : 'منتظم';
  else status = late < cur * 1.5 ? 'متأخر شهر' : 'متعثر';
  var last = null; pays.forEach(function(p){ if (!last || p.date > last) last = p.date; });
  var pct = total > 0 ? Math.max(0, Math.min(100, Math.round(AC / total * 100))) : 100;
  return { L: cur, A: A, cum: cum, bg: bg, paid: Y, instPaid: AC, rem: rem, late: late, next: next, days: days, status: status,
           X: X, AO: AO, cov: cov, last: last, extras: AA, settled: settled, pct: pct, extrasPaid: AB };
}
function payList(c){ return c.pays || S.payMap[c.n] || []; }
function rebuildPayMap(){
  S.payMap = {};
  S.pays.forEach(function(p){ (S.payMap[p.n] = S.payMap[p.n] || []).push(p); });
}
S.payMap = {};
function schedule(c, k){
  var rows = [], i, due, perm, covered = k.instPaid, K = k.A.length;
  for (i = 1; i <= K; i++){
    perm = (c.perms || []).some(function(p){ return p.inst === i; });
    due = k.bg ? edate(k.bg, i - 1 + (perm ? 1 : 0)) : null;
    var full = covered >= k.cum[i] - 0.5, part = !full && covered > k.cum[i - 1] + 0.5;
    var st = full ? 'p' : (part ? 'h' : ((due && due < today0()) ? 'l' : 'f'));
    var txt = full ? 'اتدفع' : (part ? 'جزء ' + fmt(covered - k.cum[i - 1]) : ((due && due < today0()) ? 'متأخر' : 'لسه'));
    rows.push({ i: i, due: due, perm: perm, st: st, txt: txt, amt: k.A[i - 1] });
  }
  return rows;
}
function waNum(phone){
  var n = String(phone || '').replace(/\D/g, '');
  if (n.indexOf('00') === 0) n = n.slice(2);
  else if (n.indexOf('0') === 0) n = '20' + n.slice(1);
  else if (n.length === 10 && n[0] === '1') n = '20' + n;
  return n;
}
function waLink(phone, text){
  var n = waNum(phone), t = encodeURIComponent(text);
  return n.length >= 11 ? 'https://wa.me/' + n + '?text=' + t : 'https://wa.me/?text=' + t;
}
function receiptText(c, p){
  var k = calc(c);
  var t = 'إيصال من ' + S.set.shop + '\nالعميل: ' + c.name + ' (عقد ' + c.n + ')' + (c.device ? '\nالجهاز: ' + c.device : '') +
    '\nتم استلام ' + fmt(p.amount) + ' جنيه بتاريخ ' + fmtISO(p.date) + (p.by ? '\nالمستلم: ' + p.by : '') +
    '\nالمتبقي: ' + fmt(k.rem) + ' جنيه';
  if (k.next) t += '\nالقسط الجاي: ' + fmtDate(k.next) + ' (' + fmt(k.L) + ' جنيه)';
  else if (k.rem <= 0) t += '\nمبروك، خلّصت كل الأقساط.';
  return t + '\nشكرًا لتعاملكم.';
}
function lateText(c){
  var k = calc(c);
  return 'السلام عليكم يا ' + c.name + '، تذكير من ' + S.set.shop + ': متأخر عليك ' + fmt(k.late) + ' جنيه' +
    (c.device ? ' على جهاز ' + c.device : '') + (k.days ? ' (' + k.days + ' يوم)' : '') + '. يرجى السداد في أقرب وقت. شكرًا.';
}
function statementText(c){
  var k = calc(c), s = schedule(c, k);
  var t = 'كشف حساب - ' + S.set.shop + '\nالعميل: ' + c.name + ' (عقد ' + c.n + ')' + (c.device ? '\nالجهاز: ' + c.device : '') +
    '\nإجمالي القسط: ' + fmt(c.total) + ' جنيه (' + planText(c) + ')' +
    '\nاتدفع: ' + fmt(k.paid) + ' جنيه\nالمتبقي: ' + fmt(k.rem) + ' جنيه';
  if (k.late > S.set.minLate) t += '\nالمتأخر: ' + fmt(k.late) + ' جنيه';
  if (k.next) t += '\nالقسط الجاي: ' + fmtDate(k.next);
  var ps = payList(c).slice().sort(function(a, b){ return a.date < b.date ? -1 : 1; });
  if (ps.length) t += '\n\nالدفعات:\n' + ps.map(function(p){ return fmtISO(p.date) + ' - ' + fmt(p.amount) + ' جنيه'; }).join('\n');
  return t;
}

/* ---------- storage ---------- */
function findC(id){
  for (var i = 0; i < S.contracts.length; i++) if (String(S.contracts[i].n) === String(id)) return S.contracts[i];
  return null;
}
function sortContracts(){ S.contracts.sort(function(a, b){ return a.n - b.n; }); }
function fail(msg){ return function(){ toast(msg); }; }
function contractBody(c){ var b = clone(c); delete b.pays; return b; }
function saveContract(c){
  c.rev = Date.now();
  clearTimeout(writeTimers[c.n]);
  writeTimers[c.n] = setTimeout(function(){ FB.setDoc('contracts/' + c.n, contractBody(c)).catch(fail('مقدرتش أحفظ التعديل. اتأكد من النت وجرّب تاني.')); }, 300);
  schedulePortal(c);
}
function savePay(p){
  FB.setDoc('payments/' + p.id, p).catch(fail('مقدرتش أحفظ الدفعة! جرّب تاني وتأكد إنها ظهرت.'));
  schedulePortal(findC(p.n));
}
function removePay(p){
  S.pays = S.pays.filter(function(x){ return x.id !== p.id; }); rebuildPayMap();
  FB.delDoc('payments/' + p.id).catch(fail('مقدرتش أمسح الدفعة.'));

/* ---------- one-time import from the Excel workbook ---------- */
function runImport(txt){
  if (S.imp) return;
  S.imp = 'بنحمّل البيانات...'; renderAll();
  var data;
  try { data = JSON.parse(txt); } catch(e){ S.imp = null; renderAll(); toast('ملف البيانات مش سليم.'); return; }
  var haveC = {}; S.contracts.forEach(function(c){ haveC[c.n] = true; });
  var havePay = {}; S.pays.forEach(function(p){ havePay[p.id] = true; });
  var cs = data.contracts.filter(function(c){ return !haveC[c.n]; }).map(function(c){ c = clone(c); c.rev = 1; c.imp = 1; c.perms = c.perms || []; c.ext = c.ext || []; c.token = newToken(); return c; });
  var ps = data.pays.filter(function(p){ return !havePay[p.id]; });
  var byN = {}; ps.forEach(function(p){ (byN[p.n] = byN[p.n] || []).push(p); });
  S.payMap = S.payMap || {};
  var ops = cs.map(function(c){ return ['contracts/' + c.n, c]; }).concat(ps.map(function(p){ return ['payments/' + p.id, p]; }));
  cs.forEach(function(c){
    var d = { n: c.n, email: '', name: c.name, device: c.device || '', total: +c.total || 0, months: c.months, first: c.first || '', sold: c.sold || '', shop: S.set.shop,
              perms: (c.perms || []).map(function(x){ return { inst: x.inst }; }), ext: (c.ext || []).map(function(x){ return { amount: +x.amount || 0, item: x.item || '' }; }),
              pays: (byN[c.n] || []).map(function(p){ return { date: p.date, amount: +p.amount || 0, extra: +p.extra || 0, type: p.type || '' }; }) };
    if (c.plan) d.plan = c.plan;
    ops.push(['portal/' + c.token, d]);
  });
  var i = 0, total = ops.length;
  function finish(){ S.set.imported = 2; saveSettings(); S.imp = null; renderAll(); toast('خلص الاستيراد: ' + cs.length + ' عقد و ' + ps.length + ' دفعة'); }
  if (!total){ finish(); return; }
  (function next(){
    if (i >= total){ finish(); return; }
    var chunk = ops.slice(i, i + 400); i += 400;
    FB.batchSet(chunk).then(function(){
      S.imp = 'جاري الاستيراد ' + Math.min(i, total) + ' من ' + total; renderAll(); next();
    }).catch(function(){ S.imp = null; renderAll(); toast('الاستيراد وقف. دوس استيراد تاني وهيكمل من مكانه.'); });
  })();
}

function tokensFor(c){

  });
  list.sort(function(a, b){
    if (a === c) return -1; if (b === c) return 1;

}
function qrLink(c){

function cardCanvas(c){

    x.fillStyle = '#ffffff'; x.font = '800 44px Tajawal, Tahoma, sans-serif'; x.fillText(S.set.shop, W / 2, 65);
    x.fillStyle = '#16202e'; x.font = '800 46px Tajawal, Tahoma, sans-serif'; x.fillText(c.name, W / 2, 200);
    x.fillStyle = '#5b6678'; x.font = '500 32px Tajawal, Tahoma, sans-serif'; x.fillText(c.device || 'كارت أقساط', W / 2, 252);
    var n = q.getModuleCount(), p = 4, cell = Math.floor(520 / (n + p * 2)), size = cell * (n + p * 2);

}

function safeRender(){

/* ---------- routing (#list, #day, #new, #c-<no>, #edit-<no>) ---------- */
var memHash = '';
function getHash(){ try { return (location.hash || '').replace(/^#/, ''); } catch(e){ return memHash; } }
function nav(h){
  memHash = h;
  try { if (getHash() !== h) location.hash = h; } catch(e){}
  route();
}
function route(){
  var h = getHash() || memHash, m;
  if ((m = /^c-([a-z0-9]+)$/.exec(h))){ S.view = 'detail'; S.curId = m[1]; }
  else if ((m = /^edit-([a-z0-9]+)$/.exec(h))){ S.view = 'edit'; S.curId = m[1]; }
  else if (h === 'new'){ S.view = 'new'; S.curId = null; }
  else if ((m = /^s-([a-z0-9.]+)$/.exec(h))){ S.view = 'pub'; S.curId = m[1]; }
  else if (h === 'day'){ S.view = 'day'; S.curId = null; }
  else if (h === 'staff'){ S.view = 'staff'; S.curId = null; }
  else { S.view = 'list'; S.curId = null; S.draft = null; }
  S.confirm = null;
  renderAll();
  startPub();
}
window.addEventListener('hashchange', route);

function copyText(t){
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var ok = false; try { ok = document.execCommand('copy'); } catch(e){}
    ta.remove(); toast(ok ? 'اتنسخ' : 'النسخ مش متاح هنا');
  }
  try { navigator.clipboard.writeText(t).then(function(){ toast('اتنسخ'); }, fallback); } catch(e){ fallback(); }
}
function doAddStaff(){
  var name = $('st-name').value.trim(), mail = $('st-mail').value.trim().toLowerCase(), role = $('st-role').value, e = $('stErr');
  function failm(t){ e.textContent = t; e.hidden = false; }
  if (!name) return failm('اكتب الاسم.');
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) return failm('اكتب الجيميل صح.');
  if (S.staff.some(function(x){ return x.id === mail; })) return failm('الجيميل ده موجود.');
  var m = { id: mail, name: name, role: role === 'owner' ? 'owner' : 'staff', active: true };
  S.staff.push(m); saveStaff(m); renderAll(); toast('اتضاف ' + name);
}
function saveFromDraft(){
  var d = S.draft, err = $('formErr');
  function fail(msg){ err.textContent = msg; err.hidden = false; }
  var name = d.name.trim(), total = parseFloat(d.total), months = parseInt(d.months, 10), plan = null;
  if (d.plan && d.plan.trim()){
    plan = parsePlan(d.plan);
    if (!plan.length || plan.some(function(x){ return !(x.m >= 1) || !(x.a > 0); })) return fail('الخطة مش مفهومة. اكتبها زي: 1×2500 + 8×1250');
    months = 0; total = 0; plan.forEach(function(x){ months += x.m; total += x.m * x.a; });
    var distinct = plan.length > 1 && plan.some(function(x){ return x.a !== plan[0].a; });
    if (!distinct) plan = null;
  }
  if (!name) return fail('اكتب اسم العميل.');
  if (!(total > 0)) return fail('اكتب إجمالي القسط.');
  if (!(months >= 1)) return fail('اكتب عدد الشهور.');
  if (!d.first) return fail('اختار تاريخ أول قسط.');
  if (!d.sold) return fail('اختار تاريخ البيع.');
  var c;
  if (d.editId){ c = findC(d.editId); if (!c) return fail('العقد مش موجود.'); }
  else {
    var no = 1001; S.contracts.forEach(function(x){ if (x.n >= no) no = x.n + 1; });
    c = { n: no, perms: [], ext: [], rev: 0, token: newToken() }; S.contracts.push(c);
  }
  c.name = name; c.phone = d.phone.trim(); c.nid = d.nid.trim(); c.device = d.device.trim();
  c.cash = parseFloat(d.cash) || 0; c.down = parseFloat(d.down) || 0; c.total = total; c.months = months;
  if (plan) c.plan = plan; else delete c.plan;
  if (!d.editId && S.user) c.createdBy = S.user.name;
  c.first = d.first; c.sold = d.sold; c.gname = d.gname.trim(); c.gphone = d.gphone.trim(); c.notes = d.notes.trim();
  c.email = d.email.trim().toLowerCase();
  if (c.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c.email)) return fail('الجيميل مش مكتوب صح.');
  sortContracts(); saveContract(c);
  var wasEdit = !!d.editId; S.draft = null;
  nav('c-' + c.n);
  toast(wasEdit ? 'اتحفظت التعديلات' : 'اتضاف العقد رقم ' + c.n);
}
$('main').addEventListener('click', function(e){

    var m = S.staff.filter(function(x){ return x.id === btn.dataset.id; })[0];
    if (m && isOwner()){ m.active = m.active === false; saveStaff(m); renderAll(); }
    return;
  }
  if (act === 'open'){ nav('c-' + btn.dataset.id); return; }
  if (act === 'new'){ S.draft = newDraft(); nav('new'); return; }

  } else if (act === 'delPay'){

  } else if (act === 'addPerm'){

    c.perms.push({ id: uid(), date: iso(today0()), inst: inst, why: $('pm-why').value.trim(), by: S.user.name });
    saveContract(c); renderAll(); toast('اتسجل الإذن');
  } else if (act === 'delPerm'){
    if (!isOwner()) return;
    c.perms = (c.perms || []).filter(function(x){ return x.id !== btn.dataset.p; }); saveContract(c); renderAll();
  } else if (act === 'dlCard'){ downloadCard(c);
  } else if (act === 'copyLink'){ copyText(qrLink(c));

    if (c.token) FB.delDoc('portal/' + c.token).catch(function(){});

  catch (e) { db = fsM.getFirestore(app); }
  const ref = (p) => fsM.doc(db, ...p.split('/'));
  const chg = (snap) => snap.docChanges().map((c) => ({ type: c.type, id: c.doc.id, data: c.doc.data() }));
  window.FB = {
    onAuth: (cb) => authM.onAuthStateChanged(auth, (u) => cb(u ? { email: u.email, name: u.displayName || '' } : null)),
    signIn: () => { const p = new authM.GoogleAuthProvider(); return authM.signInWithPopup(auth, p).catch((e) => {
      if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment')) return authM.signInWithRedirect(auth, p);
      throw e; }); },
    signOut: () => authM.signOut(auth),
    getDoc: (p) => fsM.getDoc(ref(p)).then((s) => (s.exists() ? s.data() : null)),
    setDoc: (p, d) => fsM.setDoc(ref(p), d),
    delDoc: (p) => fsM.deleteDoc(ref(p)),
    batchSet: (ops) => { const b = fsM.writeBatch(db); ops.forEach((o) => b.set(ref(o[0]), o[1])); return b.commit(); },
    onDoc: (p, cb, err) => fsM.onSnapshot(ref(p), (s) => cb(s.exists() ? s.data() : null), err),
    onCol: (n, cb, err) => fsM.onSnapshot(fsM.collection(db, n), (s) => cb(chg(s)), err),
    onQuery: (n, f, v, cb, err) => fsM.onSnapshot(fsM.query(fsM.collection(db, n), fsM.where(f, '==', v)), (s) => cb(chg(s)), err)
  };
  window.dispatchEvent(new Event('fb-ready'));
}
</script>
